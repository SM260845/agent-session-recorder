name: Docs links
on:
  push:
    branches: [main]
    paths: ['**/*.md', '.lycheeignore', '.github/workflows/links.yml']
  pull_request:
    paths: ['**/*.md', '.lycheeignore', '.github/workflows/links.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lychee:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --no-progress --max-retries 3 --accept 200,206,429
            README.md CONTRIBUTING.md AGENTS.md SECURITY.md SUPPORT.md CODE_OF_CONDUCT.md SKILL.md
            docs/*.md .github/*.md
          fail: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
